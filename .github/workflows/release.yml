name: release

# Builds every target, verifies the artefacts and publishes a GitHub release
# with the binaries, the source archive and a single SHA256SUMS file.
#
# Triggered by pushing a tag:  git tag -a v1.4.0 -m "GoPassGen 1.4.0" && git push origin v1.4.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.4.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: false     # pinned: the toolchain version affects the binary digest

      - name: Verify formatting and vet
        run: ./build.sh check

      - name: Run the full test suite
        run: ./build.sh test

      - name: Run tests under the race detector
        run: go test -race -short ./...

      - name: Verify the build is reproducible
        run: ./build.sh verify-reproducible

      - name: Confirm the tag matches the source version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          src="v$(sed -n 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                internal/buildinfo/buildinfo.go | head -n1)"
          if [ "${tag}" != "${src}" ]; then
            echo "tag ${tag} does not match buildinfo version ${src}" >&2
            exit 1
          fi

      - name: Build release artefacts
        run: ./build.sh dist

      - name: Self-test the freshly built linux/amd64 binary
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
                internal/buildinfo/buildinfo.go | head -n1)"
          dir="$(mktemp -d)"
          unzip -q "dist/gopassgen-v${ver}-linux-amd64.zip" -d "${dir}"
          chmod +x "${dir}/gopassgen-v${ver}-linux-amd64/gopassgen"
          "${dir}/gopassgen-v${ver}-linux-amd64/gopassgen" -self-test

      - name: Verify SHA256SUMS covers every artefact
        run: cd dist && sha256sum -c SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          gh release create "${tag}" dist/* \
            --title "GoPassGen ${tag}" \
            --notes "Deterministic passwords from BIP-39 mnemonic phrases.
          Bit-compatible with PyPassGen 1.3.5: the same phrase yields the same password.

          **Verify before running**
          \`\`\`bash
          sha256sum --ignore-missing -c SHA256SUMS
          unzip gopassgen-${tag}-linux-amd64.zip && cd gopassgen-${tag}-linux-amd64
          sha256sum -c gopassgen.sha256
          ./gopassgen -self-test
          \`\`\`

          Binaries are static, stripped and built with \`-trimpath -buildvcs=false -buildid=\`,
          so they contain no build metadata and are reproducible from the source archive."
